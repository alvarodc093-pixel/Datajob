[theme]
base = "dark"
primaryColor = "#2B6CB0"
backgroundColor = "#0E1B2C"
secondaryBackgroundColor = "#17263B"
textColor = "#E6EDF3"
linkColor = "#63A6E3"
codeTextColor = "#B9CBE0"
codeBackgroundColor = "#17263B"
borderColor = "#2A3E57"
