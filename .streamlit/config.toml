redColor = "#E5484D"
orangeColor = "#F08A24"
yellowColor = "#F5D90A"
greenColor = "#46A758"
blueColor = "#63A6E3"
violetColor = "#8E7CFA"
grayColor = "#93A6BD"

[theme.sidebar]
backgroundColor = "#0B1524"
secondaryBackgroundColor = "#132036"
